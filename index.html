<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>あずらいと / Azurite</title>
  <style>
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: sans-serif;
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .card {
      background: #161b22;
      border: 1px solid rgba(56, 139, 253, 0.3);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(0, 210, 255, 0.1);
      color: #00d2ff;
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .center { text-align: center; }
    h2 { font-size: 1.2rem; color: #00d2ff; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid #21262d; font-size: 0.95rem; }
    .date { color: #8b949e; font-family: monospace; }
    .btn {
      display: block;
      padding: 0.9rem;
      border-radius: 10px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 0.8rem;
    }
    .btn-yt { background: #ff0000; color: #fff; }
    .btn-x { background: #000; color: #fff; border: 1px solid #30363d; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card center">
      <h1>あずらいと / Azurite</h1>
      <span class="badge">ゲーム実況者</span>
      <p style="color: #8b949e;">フォートナイト / マインクラフト</p>
    </div>

    <div class="card">
      <h2>実績 / Milestones</h2>
      <ul>
        <li><span>YouTube 登録者 5,000人突破</span><span class="date">2024.01.30</span></li>
        <li><span>総再生回数 100万回突破</span><span class="date">2022.11.01</span></li>
        <li><span>YouTube 登録者 1,000人突破</span><span class="date">2022.01.27</span></li>
        <li><span>YouTube 登録者 100人突破</span><span class="date">2022.01.16</span></li>
      </ul>
    </div>

    <div class="card">
      <h2>SNS リンク</h2>
      <a href="https://x.com/Azuriteeeee" target="_blank" class="btn btn-x">X (Twitter) @Azuriteeeee</a>
      <a href="https://www.youtube.com/@Azurite" target="_blank" class="btn btn-yt">YouTube チャンネル</a>
    </div>
  </div>

</body>
</html>
